name: Explore data sources
# Downloads samples of the raw government datasets so we can read their layouts.
# Results are committed to the "explore" branch (not main).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/explore-data.yml"]
permissions:
  contents: write
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Download and sample
        run: |
          set -x
          mkdir -p out && cd out
          # --- Census of Governments 2022, Individual Unit File ---
          curl -sSL -o iuf.zip https://www2.census.gov/programs-surveys/gov-finances/tables/2022/2022_Individual_Unit_File.zip
          mkdir census && unzip -q -j iuf.zip -d census
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          find census -name "*.pdf" -print0 | while IFS= read -r -d '' f; do pdftotext -layout "$f" "doc_$(basename "$f" .pdf | tr ' &' '__').txt"; done
          PID=census/Fin_PID_2022.txt; DAT=$(ls census/2022FinEstDAT*.txt)
          grep -E "^06.{10}(SAN JOSE|SANTA CLARA|LOS ANGELES|OAKLAND)" $PID > pid_ca.txt || true
          grep -E "^33" $PID | head -40 > pid_ny_head.txt
          grep -E "^33.{10}(NEW YORK|BUFFALO|ALBANY|ROCHESTER|YONKERS|SYRACUSE)" $PID > pid_ny.txt || true
          cut -c1-3 $PID | sort | uniq -c > pid_state_type_counts.txt
          for id in $(cut -c1-12 pid_ca.txt pid_ny.txt); do grep "^$id" $DAT; done > dat_selected.txt
          cut -c13-15 $DAT | sort | uniq -c > dat_item_codes.txt
      - name: Commit to explore branch
        run: |
          cd out && rm -rf census iuf.zip
          git init -q && git checkout -q -b explore
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -q -m "Data exploration samples"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" explore
