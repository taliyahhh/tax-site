name: Build city data
# Downloads the Census and California Controller datasets, sorts spending into the site's
# categories, and commits the results to data/cities/. Runs on the 1st of every month,
# whenever the script changes, or by hand from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 1 * *"
  push:
    branches: [main]
    paths: ["scripts/build-city-data.mjs", ".github/workflows/build-data.yml"]
permissions:
  contents: write
concurrency:
  group: build-data
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build data
        run: node scripts/build-city-data.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cities
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update city spending data"
          git pull --rebase origin main
          git push
