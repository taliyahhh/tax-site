<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fee Fi Fo Fund</title>
  <meta property="og:site_name" content="Fee Fi Fo Fund">
  <meta property="og:title" content="Fee Fi Fo Fund">
  <meta property="og:description" content="Type your zip code and see where your federal, state, and city tax dollars went.">
  <meta property="og:url" content="https://feefifo.fund/">
  <link rel="canonical" href="https://feefifo.fund/">
  <meta name="description" content="Type your zip code and see where your federal, state, and city tax dollars went.">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#c9d9df">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Shared "drawn by hand" wobble for boxes and buttons, so the UI matches the logo -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="hand"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3.5" xChannelSelector="R" yChannelSelector="G"/></filter>
  </svg>

  <!-- ============ LANDING: the map ============ -->
  <section id="landing" class="landing" aria-label="Enter your zip code">
    <canvas id="map" class="map" aria-hidden="true"></canvas>

    <div class="landing-center">
      <div class="logo-wrap">
        <h1 class="logo" id="logo" aria-label="Fee Fi Fo Fund">
          <!-- Hand-lettered logo, encased in color. Each word is its own piece so it can stomp in. -->
          <svg viewBox="0 0 900 420" aria-hidden="true" focusable="false">
            <defs>
              <filter id="logo-wob"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="6"/></filter>
              <g id="lw0"><text x="70" y="190" font-size="140" textLength="225" lengthAdjust="spacingAndGlyphs">FEE</text></g>
              <g id="lw1"><text x="335" y="190" font-size="140" textLength="120" lengthAdjust="spacingAndGlyphs">FI</text></g>
              <g id="lw2"><text x="500" y="190" font-size="140" textLength="230" lengthAdjust="spacingAndGlyphs">FO</text></g>
              <g id="lw3"><text x="230" y="345" font-size="170" textLength="400" lengthAdjust="spacingAndGlyphs">FUND</text></g>
              <g id="lx"><path transform="translate(790 80) scale(1.5)" d="M0,-30 L7,-10 L28,-9 L11,4 L17,25 L0,13 L-17,25 L-11,4 L-28,-9 L-7,-10 Z"/><path transform="translate(845 175) scale(.85) rotate(15)" d="M0,-30 L7,-10 L28,-9 L11,4 L17,25 L0,13 L-17,25 L-11,4 L-28,-9 L-7,-10 Z"/><circle cx="725" cy="300" r="52"/><circle cx="130" cy="320" r="36"/></g>
            </defs>
            <!-- drawn in three passes (black outline, pink case, red ink) so the case flows around every word -->
            <g filter="url(#logo-wob)" stroke-linejoin="round" font-family="Architects Daughter, cursive">
              <use href="#lw0" class="word" style="--i:0" fill="#111" stroke="#111" stroke-width="62"/>
              <use href="#lw1" class="word" style="--i:1" fill="#111" stroke="#111" stroke-width="62"/>
              <use href="#lw2" class="word" style="--i:2" fill="#111" stroke="#111" stroke-width="62"/>
              <use href="#lw3" class="word" style="--i:3" fill="#111" stroke="#111" stroke-width="62"/>
              <use href="#lx" class="extras" style="--i:4" fill="#111" stroke="#111" stroke-width="62"/>
              <use href="#lw0" class="word" style="--i:0" fill="#eaff3a" stroke="#eaff3a" stroke-width="50"/>
              <use href="#lw1" class="word" style="--i:1" fill="#eaff3a" stroke="#eaff3a" stroke-width="50"/>
              <use href="#lw2" class="word" style="--i:2" fill="#eaff3a" stroke="#eaff3a" stroke-width="50"/>
              <use href="#lw3" class="word" style="--i:3" fill="#eaff3a" stroke="#eaff3a" stroke-width="50"/>
              <use href="#lx" class="extras" style="--i:4" fill="#eaff3a" stroke="#eaff3a" stroke-width="50"/>
              <use href="#lw0" class="word" style="--i:0" fill="#111" stroke="#111" stroke-width="9"/>
              <use href="#lw0" class="word" style="--i:0" fill="#111" stroke="#111" stroke-width="6"/>
              <use href="#lw1" class="word" style="--i:1" fill="#111" stroke="#111" stroke-width="9"/>
              <use href="#lw1" class="word" style="--i:1" fill="#111" stroke="#111" stroke-width="6"/>
              <use href="#lw2" class="word" style="--i:2" fill="#111" stroke="#111" stroke-width="9"/>
              <use href="#lw2" class="word" style="--i:2" fill="#111" stroke="#111" stroke-width="6"/>
              <use href="#lw3" class="word" style="--i:3" fill="#111" stroke="#111" stroke-width="9"/>
              <use href="#lw3" class="word" style="--i:3" fill="#111" stroke="#111" stroke-width="6"/>
              <use href="#lx" class="extras" style="--i:4" fill="#111" stroke="#111" stroke-width="9"/>
              <use href="#lx" class="extras" style="--i:4" fill="#111" stroke="#111" stroke-width="6"/>
              <text class="extras" style="--i:4" x="725" y="324" text-anchor="middle" font-size="70" fill="#eaff3a">$</text>
              <text class="extras" style="--i:4" x="130" y="338" text-anchor="middle" font-size="48" fill="#eaff3a">$</text>
            </g>
          </svg>
        </h1>
        <p class="tagline">Every dollar leaves a footprint.</p>
      </div>

      <form id="zip-form" class="zip-form" autocomplete="off">
        <label for="zip" class="zip-label">Type a zip or tap the map</label>
        <input id="zip" name="zip" inputmode="numeric" maxlength="5" placeholder="_____" aria-describedby="zip-readout">
        <p id="zip-readout" class="zip-readout" aria-live="polite">Every dot is a zip code. Drag or zoom the map, then tap a spot.</p>
        <button type="submit" id="go" class="go" disabled>Show me</button>
      </form>
    </div>
    <a class="map-sources" href="sources.html">Sources</a>
    <div class="map-controls">
      <button type="button" id="zoom-in" class="map-btn" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" class="map-btn" aria-label="Zoom out">&minus;</button>
      <button type="button" id="map-reset" class="map-btn map-reset" hidden>Whole map</button>
    </div>
  </section>

  <!-- ============ RESULTS: the collage ============ -->
  <section id="results" class="results" hidden aria-label="Where your tax dollars went">
    <header class="results-head">
      <button type="button" id="back" class="back">New zip code</button>
      <div class="place">
        <p class="place-zip" id="place-zip">95050</p>
        <p class="place-name" id="place-name">Santa Clara, California</p>
      </div>
    </header>

    <!-- The results are a stack of file folders: one per level of government -->
    <div class="file" id="file">
    <nav class="levels file-tabs" id="levels" aria-label="Level of government"></nav>
    <div class="folder" id="folder">
    <div class="frame">
      <p class="level-line" id="level-line"></p>
      <div class="collage" id="collage"></div>

      <div class="barely" id="barely">
        <p class="barely-title" id="barely-title">Barely any money here</p>
        <ul id="barely-list"></ul>
      </div>
    </div>

    <footer class="level-foot" id="level-foot"></footer>
    </div>
    </div>
  </section>

  <dialog id="detail" class="detail">
    <form method="dialog"><button class="detail-close" aria-label="Close">Close</button></form>
    <img id="detail-img" alt="">
    <h2 id="detail-title"></h2>
    <p id="detail-about"></p>
    <ul id="detail-levels" class="detail-levels"></ul>
  </dialog>

  <footer class="site-foot">
    <p>Numbers come from government budget reports and public datasets. <a href="sources.html">See all sources and methods</a>. Not tax advice.</p>
  </footer>

  <script src="data/zips.js"></script>
  <script src="data/states-lines.js"></script>
  <script src="data/categories.js"></script>
  <script src="data/budgets.js"></script>
  <script src="data/states.js"></script>
  <script src="js/map.js"></script>
  <script src="js/collage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
